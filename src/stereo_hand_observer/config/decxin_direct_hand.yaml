# Direct-capture DECXIN hand observation.
#
# The observer opens the composite device itself instead of subscribing to a
# gscam topic. Measured on this bench, the DDS path delivered observations
# with a mean age of 1133 ms because the 7.4 MB raw RGB composite backed up
# in transport; capturing directly ran the same split/rectify/2x-MediaPipe
# chain at a 147 ms loop period and 6.8 Hz, with read() steady at 25 ms.
#
# No gscam node is launched with this file, so /stereo/composite/... does not
# exist. Use decxin_atomic_hand.yaml when the raw ROS stream is wanted.
/live_stereo_hand_observer:
  ros__parameters:
    input_mode: direct
    capture_device: >-
      /dev/v4l/by-id/usb-DECXIN_DECXIN_Camera_01.00.00-video-index0
    capture_fourcc: MJPG
    capture_fps: 30.0
    capture_buffer_size: 1
    capture_period_sec: 0.005

    left_camera_info_url: >-
      package://stereo_hand_observer/config/decxin_left.yaml
    right_camera_info_url: >-
      package://stereo_hand_observer/config/decxin_right.yaml
    left_camera_name: decxin_stereo_left_1280x960
    right_camera_name: decxin_stereo_right_1280x960
    expected_composite_width: 2560
    expected_composite_height: 960
    expected_composite_encoding: rgb8
    left_frame_id: stereo_left_optical_frame
    right_frame_id: stereo_right_optical_frame
    swap_halves: false

    observation_topic: /hand_observation
    debug_image_topic: /stereo/hand_debug
    debug_image_scale: 0.5
    fallback_frame_id: stereo_left_optical_frame
    model_path: ""
    palm_landmark_indices: [5, 9, 13, 17]
    min_consensus_points: 3
    max_palm_span_m: 0.12
    min_detection_confidence: 0.7
    min_hand_presence_confidence: 0.7
    min_tracking_confidence: 0.7
    mediapipe_running_mode: video
    require_handedness_match: true

    watchdog_timeout_sec: 0.75

    # Bench volume in the LEFT CAMERA OPTICAL frame, the frame this node
    # publishes in. World-frame delivery needs a real camera-to-world
    # extrinsic and stays deferred to Objective 5.
    delivery_center_x: 0.0
    delivery_center_y: 0.0
    delivery_center_z: 0.5
    delivery_radius_m: 0.4

    required_stable_frames: 3
    min_confidence: 0.7
    max_pair_skew_sec: 0.02

    # Set from a 60-frame measurement with the hand held still at z=0.412 m.
    # Palm-knuckle epipolar error ran median 1.8-3.2 px, p95 3.3-5.6, max
    # 6.25. Tightening this does NOT protect accuracy -- it starves the
    # median: at 3.0 px only half the frames reached quorum and scatter was
    # 5.9 mm, while at 6.0 px every frame reached quorum and scatter fell to
    # 3.9 mm, because the robust median wants more surviving points rather
    # than stricter ones. 8.0 px bought only 0.3 mm more but exceeds the
    # largest error ever observed, which would leave the gate unable to
    # reject a genuine left/right mismatch, so 6.0 is the working point.
    max_epipolar_error_px: 6.0
    # Measured reprojection was p95 1.837 px, max 1.975, so this stays active.
    max_reprojection_error_px: 3.0

    # The prototype loop period was 147 ms (p95 158, max 175), so 0.2 s
    # should hold. If the bench still reports "stale", measure before
    # raising this.
    max_age_sec: 0.2
    max_point_step_m: 0.05
