# Camera-to-planning-frame extrinsic (world -> camera).
#
# ============================ SIMULATION PLACEHOLDER ========================
# These numbers are NOMINAL and effectively invented. In the Panda fake
# system the planning frame is virtual and has no physical relationship to
# the real integrated camera on the desk, so this transform cannot be
# measured — it only exists so the pipeline has a complete TF chain and the
# selector can express marker poses in the planning frame.
#
# What this DOES let us validate now: the perception -> transform -> selector
# -> /target_object_pose plumbing, and interface swappability with the fixed
# pose provider. What it does NOT give: a physically meaningful full-chain
# accuracy number. Camera-frame accuracy (which IS real) is reported
# separately in M6.
#
# On real SO-ARM101 hardware (Phase 2) this entire transform is REPLACED by a
# hand-eye calibration between the wrist/base and the mounted camera.
# ===========================================================================
#
# Convention: child_frame "camera" is v4l2_camera's image frame_id and here
# follows the ROS optical convention (z forward along the view axis, x right,
# y down), matching the OpenCV pose output published on /detected_markers.
#
# Nominal placement: camera looking straight down at the workspace from
# above, positioned so a marker held ~0.3 m in front of the lens lands near
# the already-verified reachable object1 pose (0.107, 0, 1.121), rather than
# an arbitrary point that may or may not be within the arm's workspace.
# Distance from the world origin is NOT a reliable reachability proxy here —
# object1's own verified pose sits 1.13 m from the world origin — so this
# was tuned by matching magnitude to that known-good pose, not by a reach
# radius calculation.

parent_frame: world
child_frame: camera

translation:
  x: 0.0
  y: 0.0
  z: 1.42

# Radians. roll=pi flips camera +z (forward) to world -z and camera +y to
# world -y, i.e. "camera looks straight down, right stays right." Arbitrary
# within the placeholder caveat above.
rotation_rpy:
  roll: -3.14159
  pitch: 0.0
  yaw: 0.0
